# FIC Agro — monitoreo agrícola con dron y (opcional) Sentinel-2
# ================================================================

shapefile_path: "data/shapefiles/aoi.geojson"
shapefile_id_col: "wetland_id"
shapefile_name_col: "nombre"

year_start: 2024
year_end: auto

wetlands:
  # Clip WebP y estadística: ``predios_gv/predios_gv.shp`` + ``plot_id`` (ID en PopupInfo).
  # Si hay GeoTIFF plano tipo G6_* / NOG_* en ``sources.drone``, el export puede ajustar
  # plot_id por solape orto ↔ polígonos (ver ``infer_plot_id_from_drone_overlap``). Para forzar solo config: env ``FIC_STRICT_CONFIG_PLOT_ID=1``.
  # ``ensure_master_aoi`` vuelca esas geometrías a ``shapefile_path`` en WGS84 para el mapa.
  lote_demo:
    name: "Lote demostración"
    aoi_source: &predios_sel "data/shapefiles/predios_gv/predios_gv.shp"
    plot_id: "01"
  g1:
    name: "Campo temporal G1"
    aoi_source: *predios_sel
    plot_id: "01"
  g2:
    name: "Parcela demostración G2"
    aoi_source: *predios_sel
    plot_id: "02"
  g3:
    name: "Lote pendiente alta resolución G3"
    aoi_source: *predios_sel
    plot_id: "04"
  g4:
    name: "Predio temporal G4"
    aoi_source: *predios_sel
    plot_id: "07"
  g5:
    name: "Predio temporal G5"
    aoi_source: *predios_sel
    plot_id: "14"
  g6:
    name: "Predio temporal G6"
    aoi_source: *predios_sel
    plot_id: "24"
  nog:
    name: "Predio NOG (sin G numérico)"
    aoi_source: *predios_sel
    plot_id: "10"
  rci:
    name: "Predio RCI — Alejandra Brito"
    aoi_source: "data/shapefiles/predios_ab/predio_RCI.geojson"
  rpa:
    name: "Predio RPA — Alejandra Brito"
    aoi_source: "data/shapefiles/predios_ab/predio_RPA.geojson"
  riv:
    name: "Predio RIV — Bruno Devoto"
    aoi_source: "data/shapefiles/predios_bd/predio_RIV.geojson"

sources:
  sentinel2:
    label: "Sentinel-2"
    description: "Series estacionales de referencia (opcional)."
    input_root: "data/sentinel2"
    static_root: "data_static/sentinel2"
    enabled: false
    download_enabled: true
    color: "#38bdf8"
    indices: ["ndvi", "ndwi"]
  drone:
    label: "Dron multiespectral"
    description: "Ortofotos e índices de campañas de vuelo."
    input_root: "data/drone"
    legacy_input_roots: []
    static_root: "data_static/drone"
    enabled: true
    download_enabled: false
    color: "#22c55e"
    indices: ["ndvi", "ndwi", "rgb", "thermal"]
    # Archivos planos: G4_YYYYMMDD_ndvi.tif o G4_YYYY_MM_DD_ndvi.tif → data_static/drone/rasters/…webp
    flat_date_filenames: true

raster_visualization:
  preview_format: "WEBP"
  upscale_factor: 2
  preserve_pixels: true
  opacity: 0.9
  clip_to_aoi: true
  # Calidad visual WebP (explorador): RGB ~alta; índices analíticos ~balance tamaño/calidad
  rgb_webp_quality: 78
  webp_quality_analytic: 86
  index_preview_max_size: 4096
  rgb_max_size: 4096
  rgb_upscale_factor: 1
  rgb_quantize_colors: 64
  rgb_stretch_percentiles: [2, 98]
  # Metros de dilatación del polígono del predio para el recorte WebP; 0 = estrictamente el shape del AOI.
  clip_aoi_buffer_m: 0
  # Compatibilidad: si no defines `clip_aoi_buffer_m`, se usa este valor.
  rgb_context_buffer_m: 0
  # RGB en Leaflet: orto siempre opaca sobre el mapa base (valor en metadata/visual).
  rgb_leaflet_opacity: 1.0
  # Si false (recomendado), ignora banda 4 como alfa: evita ortos semitransparentes cuando el TIFF no trae alpha opaca.
  rgb_use_source_alpha_band: false
  # Ortos sin GDAL nodata: ocultar relleno blanco/negro casi uniforme (fracciones del máximo del dtype).
  rgb_hide_white_black_borders: true
  rgb_border_white_frac_of_max: 0.982
  rgb_border_black_frac_of_max: 0.02
  # Relleno pastel (marco TIFF/rosa claro): alta media y poca croma; tunear si se recorta demasiada suelo claro homogéneo.
  rgb_border_near_gray_spread_uint8: 42
  rgb_border_near_gray_mean_min_uint8: 226
  # Espera (s) entre GeoTIFF grandes en el export flat; 0 = sólo gc entre archivos. Env: FIC_PAUSE_BETWEEN_DRONE_TIFFS_SEC
  pause_between_drone_tiffs_sec: 0
  # Si false, regenera todos los WebP aunque el export_signature coincida con metadata anterior.
  reuse_exported_webp_if_unchanged: true
  # Quita una previsualización previa antes de grabarla (siempre sobrescribe el archivo de salida).
  overwrite_preview_file: true

seasons:
  verano: "Verano"
  otono: "Otoño"
  invierno: "Invierno"
  primavera: "Primavera"

indices:
  ndvi:
    label: "NDVI"
    description: "Índice de vegetación"
    bands: ["B8", "B4"]
    colormap: "RdYlGn"
    vmin: -1
    vmax: 1
  ndwi:
    label: "NDWI"
    description: "Índice de humedad"
    bands: ["B3", "B8"]
    colormap: "RdYlBu"
    vmin: -1
    vmax: 1
  rgb:
    label: "RGB"
    description: "Ortomosaico color"
    visual_only: true
  thermal:
    label: "Térmica"
    description: "Ortomosaico térmico"
    visual_only: true
    colormap: "Turbo"
    stretch_percentiles: [0, 100]
    stretch_percentiles_p95_legend: [0, 95]
    legend_p95_wetland_ids: ["riv"]

stats: ["mean"]
