# FIC Agro — monitoreo agrícola con dron y (opcional) Sentinel-2
# ================================================================

vectors_root: "data/vectors"
kml_root: "data/vectors/kml"
vuelos_geojson_root: "data/vectors/vuelos"
cuarteles_path: "data/vectors/cuarteles/cuarteles.geojson"
shapefile_path: "data/vectors/cuarteles/cuarteles.geojson"
predios_aoi_path: "data_static/predios_aoi.geojson"
predios_aoi_authoritative: false
cuarteles_geojson_authoritative: true
shapefile_id_col: "id_cuartel"
shapefile_name_col: "nom_predio"

year_start: 2018
year_end: auto

predios:
  # Códigos alineados con nombres de archivos dron: {DRONE_CODE}_YYYYMMDD_{indice}.tif
  # y con fic_database.csv (poligono_vuelo). s2_code = prefijo S2_* en data/sentinel2 (S2_{INICIAL}_{APELLIDO}_Y{YYYY}_W{WW}).
  l_martinez:
    name: "Parcela 17 — Luisa Martinez"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-L-MARTINEZ-X"
    drone_code: "L_MARTINEZ"
    s2_code: "L_MARTINEZ"
  r_pani:
    name: "Parcela 31 — Roxana Pani"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-R-PANI-X"
    drone_code: "R_PANI"
    s2_code: "R_PANI"
  d_mondaca:
    name: "Parcela 8 — Domingo Mondaca"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-D-MONDACA-X"
    drone_code: "D_MONDACA"
    s2_code: "D_MONDACA"
  j_contreras:
    name: "Parcela 14 — Juan Contreras"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-J-CONTRERAS-X"
    drone_code: "J_CONTRERAS"
    s2_code: "J_CONTRERAS"
  e_sazo:
    name: "Parcela 24 — Emilio Sazo"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-E-SAZO-X"
    drone_code: "E_SAZO"
    s2_code: "E_SAZO"
  o_herrera:
    name: "Nectarin — Oscar Herrera"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-O-HERRERA-X"
    drone_code: "O_HERRERA"
    s2_code: "O_HERRERA"
  a_brito_rci:
    name: "El resguardo RCI — Alejandra Brito"
    aoi_filter_col: "id_cuartel"
    aoi_filter_val: "c00014"
    drone_code: "A_BRITO_RCI"
    s2_code: "A_BRITO_RCI"
  a_brito_rpa:
    name: "El resguardo RPA — Alejandra Brito"
    aoi_filter_col: "id_cuartel"
    aoi_filter_val: "c00012,c00013"
    drone_code: "A_BRITO_RPA"
    s2_code: "A_BRITO_RPA"
  b_devoto:
    name: "Agr. Rivarola — Bruno Devoto"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-B-DEVOTO-X"
    drone_code: "B_DEVOTO"
    s2_code: "B_DEVOTO"
  c_alvarado:
    name: "Nogales — Claudio Alvarado"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-C-ALVARADO-X"
    drone_code: "C_ALVARADO"
    s2_code: "C_ALVARADO"
  r_porfiri:
    name: "Hacienda Rinconada — Ricardo Porfiri"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-B-PORFIRI-X"
    drone_code: "R_PORFIRI"
    s2_code: "R_PORFIRI"
  v_siebenthal:
    name: "Von Siebenthal — Viña Von Siebenthal"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-V-SIEBENTHAL-X"
    drone_code: "V_SIEBENTHAL"
    s2_code: "V_SIEBENTHAL"
  v_siebenthal2:
    name: "Von Siebenthal 2 — Viña Von Siebenthal"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-V-SIEBENTHAL2-X"
    drone_code: "V_SIEBENTHAL2"
    s2_code: "V_SIEBENTHAL2"
  v_siebenthal3:
    name: "Von Siebenthal 3 — Viña Von Siebenthal"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-V-SIEBENTHAL3-X"
    drone_code: "V_SIEBENTHAL3"
    s2_code: "V_SIEBENTHAL3"
  a_inguerzon:
    name: "Alfalfa — Anita Inguerzon"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-A-INGUERZON-X"
    drone_code: "A_INGUERZON"
    s2_code: "A_INGUERZON"
  v_fernandez:
    name: "Trinidad — Vicente Fernandez"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-V-FERNANDEZ-X"
    drone_code: "V_FERNANDEZ"
    s2_code: "V_FERNANDEZ"
  r_salazar:
    name: "Palto — Rodrigo Salazar"
    aoi_filter_col: "poligono_vuelo"
    aoi_filter_val: "FIC-R-SALAZAR-X"
    drone_code: "R_SALAZAR"
    s2_code: "R_SALAZAR"

sources:
  sentinel2:
    label: "Sentinel-2"
    description: "Series estacionales de referencia (opcional)."
    input_root: "data/sentinel2"
    static_root: "data_static/sentinel2"
    enabled: true
    download_enabled: true
    color: "#38bdf8"
    # 9 índices operativos GEE (ver scripts/gee/README.md).
    indices: ["ndvi", "ndmi", "mndwi", "rededge_position", "mcari", "gndvi", "msavi", "evi", "psri"]
  drone:
    label: "Dron multiespectral"
    description: "Ortofotos e índices de campañas de vuelo."
    input_root: "data/drone"
    legacy_input_roots: []
    static_root: "data_static/drone"
    enabled: true
    download_enabled: false
    color: "#22c55e"
    indices: ["ndvi", "ndwi", "ndci", "rgb", "thermal"]
    # Archivos planos: L_MARTINEZ_YYYYMMDD_ndvi.tif → data_static/drone/rasters/…webp
    flat_date_filenames: true

raster_visualization:
  preview_format: "WEBP"
  upscale_factor: 2
  preserve_pixels: true
  opacity: 0.9
  clip_to_aoi: true
  rgb_webp_quality: 78
  webp_quality_analytic: 86
  index_preview_max_size: 4096
  rgb_max_size: 4096
  rgb_upscale_factor: 1
  rgb_quantize_colors: 64
  rgb_stretch_percentiles: [2, 98]
  clip_aoi_buffer_m: 0
  rgb_context_buffer_m: 0
  rgb_leaflet_opacity: 1.0
  rgb_use_source_alpha_band: false
  rgb_hide_white_black_borders: true
  rgb_border_white_frac_of_max: 0.982
  rgb_border_black_frac_of_max: 0.02
  rgb_border_near_gray_spread_uint8: 42
  rgb_border_near_gray_mean_min_uint8: 226
  pause_between_drone_tiffs_sec: 0
  reuse_exported_webp_if_unchanged: true
  overwrite_preview_file: true

seasons:
  verano: "Verano"
  otono: "Otoño"
  invierno: "Invierno"
  primavera: "Primavera"

indices:
  ndvi:
    label: "NDVI"
    description: "Índice de vegetación"
    bands: ["B8", "B4"]
    colormap: "RdYlGn"
    vmin: -1
    vmax: 1
  ndwi:
    label: "NDWI"
    description: "Índice de humedad"
    bands: ["B3", "B8"]
    colormap: "RdYlBu"
    vmin: -1
    vmax: 1
  ndci:
    label: "NDCI"
    description: "Índice de clorofila (borde rojo)"
    colormap: "RdYlGn"
    vmin: -1
    vmax: 1
  rgb:
    label: "RGB"
    description: "Ortomosaico color"
    visual_only: true
  thermal:
    label: "Térmica"
    description: "Ortomosaico térmico"
    visual_only: true
    colormap: "Turbo"
    stretch_percentiles: [0, 100]
    stretch_percentiles_p95_legend: [0, 98]
    legend_p95_predio_ids: ["b_devoto"]

stats: ["mean"]
