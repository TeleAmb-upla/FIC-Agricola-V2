<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Agrícola · Iniciar sesión</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fic-bg: #eef4ed;
            --fic-surface: #ffffff;
            --fic-border: #c5d4c0;
            --fic-text: #1a2e1f;
            --fic-muted: #4a5c4e;
            --fic-accent: #1d6b4a;
            --fic-accent-soft: rgba(29, 107, 74, 0.1);
            --fic-danger: #7a1e1e;
            --fic-shadow: 0 4px 20px rgba(26, 46, 31, 0.08);
            --fic-radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Source Sans 3', system-ui, sans-serif;
            background: var(--fic-bg);
            background-image: radial-gradient(ellipse 80% 50% at 50% -20%, var(--fic-accent-soft), transparent 55%);
            color: var(--fic-text);
            line-height: 1.55;
            min-height: 100svh;
            font-size: clamp(15px, calc(0.25vw + 14px), 16px);
        }
        .fic-login {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 4vw, 2rem);
        }
        .fic-login-card {
            width: min(26rem, 100%);
            background: var(--fic-surface);
            border: 2px solid var(--fic-border);
            border-radius: var(--fic-radius);
            box-shadow: var(--fic-shadow);
            padding: clamp(1.25rem, 4vw, 1.75rem);
        }
        .fic-login-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        .fic-login-brand img {
            width: clamp(64px, 16vw, 88px);
            height: auto;
            flex-shrink: 0;
        }
        .fic-login-brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.05rem, 2.5vw, 1.2rem);
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }
        .fic-login-brand p {
            font-size: 0.86rem;
            color: var(--fic-muted);
            margin-top: 0.2rem;
        }
        .fic-login-eyebrow {
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--fic-accent);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .fic-login-lead {
            font-size: 0.92rem;
            color: var(--fic-muted);
            margin-bottom: 1.25rem;
        }
        .fic-field { margin-bottom: 1rem; }
        .fic-field label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--fic-muted);
            margin-bottom: 0.35rem;
        }
        .fic-field input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: 12px;
            border: 1.5px solid var(--fic-border);
            font: inherit;
            color: var(--fic-text);
            background: #fff;
        }
        .fic-field input:focus {
            outline: none;
            border-color: var(--fic-accent);
            box-shadow: 0 0 0 3px var(--fic-accent-soft);
        }
        .fic-btn {
            width: 100%;
            margin-top: 0.35rem;
            padding: 0.72rem 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(165deg, var(--fic-accent), #0d4d35);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .fic-btn:hover { opacity: 0.92; }
        .fic-btn:disabled { opacity: 0.55; cursor: wait; }
        .fic-error {
            display: none;
            margin-top: 0.85rem;
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            background: rgba(122, 30, 30, 0.08);
            border: 1px solid rgba(122, 30, 30, 0.2);
            color: var(--fic-danger);
            font-size: 0.88rem;
        }
        .fic-error[aria-hidden="false"] { display: block; }
        .fic-hint {
            margin-top: 1rem;
            font-size: 0.78rem;
            color: var(--fic-muted);
            text-align: center;
        }
    </style>
</head>
<body>
<div class="fic-login">
    <div class="fic-login-card">
        <div class="fic-login-brand">
            <img src="assets/img/Logo_FIC_Teleamb.png" width="88" height="88" alt="FIC TeleAmb">
            <div>
                <h1>Monitoreo Satelital Agrícola</h1>
                <p>Adaptación al cambio climático</p>
            </div>
        </div>
        <p class="fic-login-eyebrow">Acceso</p>
        <p class="fic-login-lead">Ingresa tus credenciales de agricultor para acceder al mapa.</p>
        <form id="ficLoginForm" autocomplete="on">
            <div class="fic-field">
                <label for="ficLoginUser">Nombre de usuario</label>
                <input id="ficLoginUser" name="usuario" type="text" required autocomplete="username">
            </div>
            <div class="fic-field">
                <label for="ficLoginPass">Contraseña</label>
                <input id="ficLoginPass" name="password" type="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="fic-btn" id="ficLoginSubmit">Entrar al mapa</button>
        </form>
        <div class="fic-error" id="ficLoginError" role="alert" aria-hidden="true"></div>
        <p class="fic-hint">Si no recuerdas tus datos, contacta al equipo FIC.</p>
    </div>
</div>
<script>
(function () {
    'use strict';

    var AUTH_KEY = 'ficAuthSession';
    var CSV_URL = 'data/fic_database.csv';

    function trim(v) {
        return String(v == null ? '' : v).trim();
    }

    function norm(s) {
        return trim(s).toLocaleLowerCase('es');
    }

    function apellidoFromNombre(nombre) {
        var parts = trim(nombre).split(/\s+/).filter(Boolean);
        return parts.length ? parts[parts.length - 1] : '';
    }

    function parseCsv(text) {
        var rows = [];
        var lines = text.split(/\r?\n/);
        for (var i = 1; i < lines.length; i++) {
            var ln = trim(lines[i]);
            if (!ln) continue;
            var p = ln.split(',');
            rows.push({
                codigo_predio: trim(p[0]).toUpperCase(),
                nombre_agricultor: trim(p[1] || ''),
                nombre_sat_asesor: trim(p[2] || '')
            });
        }
        return rows;
    }

    function buildAuthIndex(rows) {
        var ag = {};
        rows.forEach(function (r) {
            var na = trim(r.nombre_agricultor);
            if (na) ag[norm(na)] = na;
        });
        return { agricultores: ag };
    }

    function validateCredentials(usuario, password, index) {
        var u = norm(usuario);
        var p = norm(password);
        if (!u || !p) return { ok: false };

        var matchAg = index.agricultores[u];
        if (matchAg && norm(apellidoFromNombre(matchAg)) === p) {
            return {
                ok: true,
                session: { rol: 'agricultor', nivel: 'agricultor', nombre: matchAg }
            };
        }
        return { ok: false };
    }

    function saveSession(session) {
        try {
            sessionStorage.setItem(AUTH_KEY, JSON.stringify(session));
        } catch (e) { /* ignore */ }
    }

    function goExplorador(session) {
        saveSession(session);
        window.location.href = 'explorador.html?nivel=' + encodeURIComponent(session.nivel);
    }

    function showError(msg) {
        var el = document.getElementById('ficLoginError');
        if (!el) return;
        el.textContent = msg;
        el.setAttribute('aria-hidden', msg ? 'false' : 'true');
    }

    var authIndex = null;

    fetch(CSV_URL)
        .then(function (r) {
            if (!r.ok) throw new Error('CSV');
            return r.text();
        })
        .then(function (text) {
            authIndex = buildAuthIndex(parseCsv(text));
        })
        .catch(function () {
            showError('No se pudo cargar la base de usuarios. Revisa la conexión o avisa al equipo técnico.');
        });

    document.getElementById('ficLoginForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        showError('');
        if (!authIndex) {
            showError('Aún cargando usuarios… intenta de nuevo en unos segundos.');
            return;
        }
        var usuario = document.getElementById('ficLoginUser').value;
        var password = document.getElementById('ficLoginPass').value;
        var result = validateCredentials(usuario, password, authIndex);
        if (!result.ok) {
            showError('Usuario o contraseña incorrectos.');
            return;
        }
        goExplorador(result.session);
    });

    try {
        var prev = sessionStorage.getItem(AUTH_KEY);
        if (prev) {
            var s = JSON.parse(prev);
            if (s && s.nombre && s.nivel) {
                window.location.replace('explorador.html?nivel=' + encodeURIComponent(s.nivel));
            }
        }
    } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
